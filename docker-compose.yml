services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: system-metrics-api:local
    container_name: metrics-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    # Le HEALTHCHECK est défini dans Dockerfile.api ; Compose s'en sert
    # pour la condition service_healthy ci-dessous.

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: system-metrics-agent:local
    container_name: metrics-agent
    # .env n'est pas versionné : copier .env.example en .env
    env_file:
      - path: .env
        required: false
    environment:
      # Dans Compose, l'API se joint par son nom de service, pas par 127.0.0.1.
      # Cette valeur l'emporte sur celle éventuellement présente dans .env.
      METRICS_ENDPOINT: http://api:8000/metrics
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # --- Supervision (Prometheus + Grafana) ---
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: metrics-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: metrics-grafana
    environment:
      # Identifiants par défaut pour le TP : à changer hors environnement local.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
