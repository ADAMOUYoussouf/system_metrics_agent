sonar.organization=adamouyoussouf
sonar.projectKey=ADAMOUYoussouf_system_metrics_agent
sonar.projectName=system_metrics_agent

sonar.sources=app
sonar.tests=app/tests
sonar.exclusions=app/tests/**
sonar.test.inclusions=app/tests/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# Le scanner attend le résultat et échoue si la Quality Gate n'est pas validée
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
